<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
    display: flex;
    flex-direction: column;     /* 縦並び */
    justify-content: center;    /* 縦方向の中央 */
    align-items: center;        /* 横方向の中央 */
    height: 100vh;              /* 画面全体の高さを使う */
}

form {
    display: flex;
    flex-direction: column;
    gap: 15px;                  /* 各要素間の余白 */
    background: rgba(255, 255, 255, 0.6); /* 白背景（半透明） */
    padding: 20px;
    border-radius: 10px;
    width: 300px;               /* フォームの横幅を固定 */
}
    </style>
</head>
<body>
    <div class="container">
        <h1>お問い合わせ</h1>

        <form action="https://formspree.io/f/xljeyglv" method="post">
            <label>お名前</label>
            <input type="text" name="name" required>

            <label>メールアドレス</label>
            <input type="email" name="email" required>

            <label>バグ内容</label>
            <textarea name="message" required></textarea>

            <button type="submit">送信</button>
        </form>
    </div>
</body>
</html>
