<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おぢさんもんじゃ</title>
    <style>
        #recordingAudios audio{
            width: 66.6666%;
            max-width: none; 
            margin: 10px 0;
            display: block;
            transform-origin: center;
        }

        #displayImg,#answerDisplayImg{
            width: 80%;
            margin: auto;
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -moz-touch-collout: none;
            -moz-user-select: none;
            display: block;
        }

        #recBtn,#stopBtn,#answerBtn,#playingAudio{
            width: 30%;
            margin: auto;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -moz-touch-collout: none;
            -moz-user-select: none;
            outline: none;
            background: transparent !important;
            display: block;
        }

        #playingAudio{
            padding: 50px 0px;
        }

        #nextBtn,#answerNextBtn{
            width: 30%;
            text-align: right;
            margin-left: auto; 
            margin-right: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -moz-touch-collout: none;
            -moz-user-select: none;
            outline: none;
            background: transparent !important;
            display: block;
        }

        button:disabled {
            filter: saturate(0.1);
            cursor: not-allowed;
        }

        #gameStartImg{
            width: 100%;
        }

        /* 共通の戻るボタンスタイル */
        .return-btn {
            position: fixed;
            left: 5vw;                       /* 画面左からの余白 */
            bottom: 5vh;                     /* 画面下からの余白 */
            width: clamp(48px, 30vw, 150px); /* 最小48px、理想30vw、最大140px */
            height: auto;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            background: transparent;
            border: none;
            border-radius: 8px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            cursor: pointer;
        }

        /* 画像は親幅に合わせる */
        .return-btn img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none; /* 親ボタンでクリックを受ける */
        }

        /* PCなど大画面では固定ピクセルに切り替え */
        @media (min-width: 900px) {
            .return-btn {
                left: 24px;
                bottom: 24px;
                width: 150px;
            }
        }
    </style>
</head>
<body>
    <div id="recordingPage">
        <div id="counter">1/12</div>

        <img id="displayImg" src="" alt="">
        
        <img id="recBtn" src="recBtnBefore.png" alt="recBtn" onclick="recBtnClick()">
        <img id="stopBtn" src="stopBtnBefore.png" alt="stopBtn" onclick="stopBtnClick()">

        <button id="returnBtnRecording" class="return-btn" aria-label="前の画面に戻る" style="display:none" onclick="returnBtnClick()">
            <img src="return.png" alt="戻る">
        </button>

        <audio id="recordingAudio" src="" controls></audio>

        <button id="debug">SKIP</button>
    </div> 

    <div id="transitionPage" style="display: none;">
        <h1>右隣の人にスマホを渡してね</h1>
        
        <img id="transitionNextBtn" src="nextBtn.png" alt="nextBtn" onclick="goNextRecording()">

        <button id="returnBtnTransition" class="return-btn" aria-label="前の画面に戻る" onclick="returnBeforeRecording()">
            <img src="return.png" alt="戻る">
        </button>
    </div>

    <div id="gameStartUI" style="display: none;">
        <img id="gameStartImg" src="GAME_START.png" alt="GAME START!">
    </div>

    <div id="answerPage" style="display: none;">
        <div id="answerCounter">1/24</div>

        <img id="answerDisplayImg" src="img0.png" alt="answerImg">

        <audio id="playingAudio" src="" controls></audio>

        <img id="answerBtn" src="answerBtn.png" alt="answerBtnImg" onclick="answerBtnClick()">
        <img id="answerNextBtn" src="nextBtn.png" alt="nextBtnImg" onclick="nextBtnClick()" style="display: none;">
    </div>

    <script src="recordAndPlay.js"></script>
</body>
</html>
